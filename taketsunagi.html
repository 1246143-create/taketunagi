<title>竹つなぎ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+1p:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width app column (header / scrolling view / action bar / tab nav), centered on wide screens */
:root{
  --outer:#dfe8d8;
  --bg:#f2f6ee;
  --surface:#ffffff;
  --ink:#1d2b20;
  --muted:#5b6b5e;
  --line:#dae4d3;
  --bamboo:#2d6a3e;
  --bamboo-soft:#e0eed9;
  --on-bamboo:#ffffff;
  --leaf:#7fae2e;
  --sun:#c98512;
  --sun-soft:#fbefd6;
  --danger:#b3412f;
  --map-land:#e6efd9;
  --map-hill:#cfe0bd;
  --map-sea:#bcd9e3;
  --map-road:#ffffff;
  --map-text:#6d7f70;
  --shadow:0 1px 2px rgba(29,43,32,.06),0 4px 14px rgba(29,43,32,.06);
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"M PLUS 1p","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --outer:#0c110d;--bg:#121914;--surface:#1a241d;--ink:#e4ede2;--muted:#9baa9d;--line:#2a392e;
  --bamboo:#72c488;--bamboo-soft:#20362a;--on-bamboo:#0d1a11;--leaf:#a5d45a;--sun:#f0b650;--sun-soft:#3a2f18;--danger:#f08a78;
  --map-land:#1d2a20;--map-hill:#24362a;--map-sea:#1c3340;--map-road:#33453a;--map-text:#8a9c8d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --outer:#0c110d;--bg:#121914;--surface:#1a241d;--ink:#e4ede2;--muted:#9baa9d;--line:#2a392e;
  --bamboo:#72c488;--bamboo-soft:#20362a;--on-bamboo:#0d1a11;--leaf:#a5d45a;--sun:#f0b650;--sun-soft:#3a2f18;--danger:#f08a78;
  --map-land:#1d2a20;--map-hill:#24362a;--map-sea:#1c3340;--map-road:#33453a;--map-text:#8a9c8d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}

.app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:480px){.app{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.12)}}

.topbar{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;color:var(--bamboo)}
.brand span{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.04em}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;margin-left:-8px}
.icon-btn:hover{background:var(--bamboo-soft)}
.pt-chip{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:var(--sun-soft);color:var(--sun);font-weight:700;font-size:13px;border:0;font-variant-numeric:tabular-nums}

#view{flex:1;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:20px}
#action{padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}
.tabnav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11px;color:var(--muted)}
.tabnav button[aria-current="page"]{color:var(--bamboo);font-weight:700}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:10px 18px;border-radius:12px;border:0;font-weight:700;font-size:16px;background:var(--bamboo);color:var(--on-bamboo)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--surface);color:var(--bamboo);box-shadow:inset 0 0 0 1.5px var(--bamboo)}
.btn.small{min-height:38px;font-size:14px;padding:6px 14px;width:auto;border-radius:10px}
.btn.sun{background:var(--sun);color:var(--on-bamboo)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* home */
.hero{position:relative;border-radius:20px;overflow:hidden;background:var(--bamboo);color:var(--on-bamboo);padding:26px 20px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%}
.hero .copy{position:relative}
.hero h2{font-size:26px;font-weight:900;letter-spacing:.02em}
.hero p{margin:6px 0 0;font-size:14px;opacity:.92}
.main-actions{display:grid;gap:12px}
.big-choice{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;border:0;text-align:left;background:var(--surface);box-shadow:var(--shadow);width:100%}
.big-choice .ic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--bamboo-soft);color:var(--bamboo)}
.big-choice.primary{background:var(--bamboo);color:var(--on-bamboo)}
.big-choice.primary .ic{background:rgba(255,255,255,.16);color:var(--on-bamboo)}
.big-choice b{display:block;font-family:var(--f-display);font-size:19px}
.big-choice small{display:block;font-size:13px;opacity:.8}
.big-choice .arr{margin-left:auto;flex:none}
.section-title{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:10px}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--bamboo-soft);color:var(--bamboo);font-weight:700;display:grid;place-items:center;font-size:13px}
.steps b{display:block}
.steps span{font-size:13px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);text-align:center}

/* map */
.map{position:relative;width:100%;max-width:100%;aspect-ratio:360/250;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--map-land)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.pin .tag{background:var(--surface);color:var(--bamboo);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
.pin svg{position:static;width:26px;height:30px}
.pin.sel .tag{background:var(--bamboo);color:var(--on-bamboo)}
.pin.sel svg{transform:scale(1.2);transform-origin:bottom}
.pin.mine .tag{color:var(--sun)}
.me{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#2f7fd1;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,127,209,.22)}
.map-legend{position:absolute;left:8px;bottom:8px;font-size:11px;background:var(--surface);padding:2px 8px;border-radius:8px;color:var(--muted);display:flex;align-items:center;gap:6px}
.map-legend i{width:9px;height:9px;border-radius:50%;background:#2f7fd1;display:inline-block}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--bamboo);border-color:var(--bamboo);color:var(--on-bamboo)}
.sort{margin-left:auto;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:13px}
.count{font-size:13px;color:var(--muted)}

.cards{display:grid;gap:12px}
.card{display:flex;gap:12px;padding:10px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid transparent;text-align:left;width:100%}
.card.sel{border-color:var(--bamboo)}
.card .thumb{flex:none;width:92px;height:92px;border-radius:10px;overflow:hidden}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.tasks{display:flex;flex-wrap:wrap;gap:4px}
.task{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--bamboo-soft);color:var(--bamboo)}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:12.5px}
.pts{color:var(--sun);font-weight:700;font-variant-numeric:tabular-nums}
.pts big{font-size:18px;font-family:var(--f-display)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r);border:1px dashed var(--line)}

/* detail */
.banner{border-radius:18px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.banner svg,.banner img{width:100%;height:100%;display:block;object-fit:cover}
.d-head{display:flex;flex-direction:column;gap:6px}
.d-head h2{font-size:23px}
.loc{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.panel{background:var(--surface);border-radius:var(--r);padding:4px 16px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.kv:last-child{border-bottom:0}
.kv dt{font-size:13px;color:var(--muted);font-weight:500}
.kv dd{margin:0;font-weight:500;min-width:0;font-variant-numeric:tabular-nums}
dl{margin:0}
.bar{height:8px;border-radius:99px;background:var(--bamboo-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--bamboo);border-radius:99px}
.reward{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--sun-soft)}
.reward .num{font-family:var(--f-display);font-weight:900;font-size:34px;color:var(--sun);line-height:1;font-variant-numeric:tabular-nums}
.reward .num small{font-size:16px;margin-left:2px}
.reward p{margin:0;font-size:13px;color:var(--ink)}
.task-list{display:grid;gap:8px}
.task-row{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border-radius:12px;border:1px solid var(--line)}
.task-row .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--bamboo-soft);color:var(--bamboo)}
.task-row b{display:block}
.task-row span{font-size:13px;color:var(--muted)}
.msg{background:var(--surface);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);font-size:14px}
.msg .who{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--bamboo-soft);color:var(--bamboo);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.bring{font-size:13px;color:var(--muted);margin:8px 0 0}

/* form */
form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:700;font-size:14px}
.req{font-size:11px;color:var(--on-bamboo);background:var(--danger);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;font-weight:700}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select.input,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--bamboo);outline:none}
textarea{min-height:80px;resize:vertical}
.pair{display:flex;gap:8px}
.pair>*{min-width:0}
.pair>:first-child{flex:1}
.pair>select{flex:none;width:auto}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.check{position:relative}
.check input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.check span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--muted)}
.check input:checked+span{border-color:var(--bamboo);background:var(--bamboo-soft);color:var(--bamboo)}
.check input:focus-visible+span{outline:3px solid var(--leaf);outline-offset:2px}
.photo-drop{position:relative;display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;border-radius:14px;border:2px dashed var(--line);background:var(--surface);color:var(--muted);overflow:hidden;text-align:center;font-size:14px}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);width:max-content}
.stepper button{width:46px;height:44px;border:0;background:none;font-size:22px;color:var(--bamboo)}
.stepper input{width:64px;border:0;text-align:center;min-height:44px;background:none;font-weight:700;font-size:17px}
.map.pick{cursor:crosshair}
.err{color:var(--danger);font-size:13px;font-weight:700}
.fill-demo{align-self:flex-start}

/* mypage */
.profile{display:flex;align-items:center;gap:12px}
.profile .avatar{width:48px;height:48px;font-size:18px}
.profile b{font-family:var(--f-display);font-size:18px;display:block}
.profile span{font-size:13px;color:var(--muted)}
.point-card{border-radius:18px;padding:18px;background:var(--bamboo);color:var(--on-bamboo);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.point-card .lab{font-size:13px;opacity:.85}
.point-card .val{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.point-card .val small{font-size:18px;margin-left:4px}
.point-card .btn{background:var(--on-bamboo);color:var(--bamboo);min-height:42px;font-size:14px}
.point-card svg.deco{position:absolute;right:-10px;top:-10px;width:130px;height:130px;opacity:.18}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:22px;color:var(--bamboo);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bamboo-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--bamboo);box-shadow:var(--shadow)}
.list{display:grid;gap:10px}
.item{background:var(--surface);border-radius:var(--r);padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-top h3{font-size:16px;min-width:0}
.status{flex:none;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.st-pending{background:var(--sun-soft);color:var(--sun)}
.st-approved{background:var(--bamboo-soft);color:var(--bamboo)}
.st-done{background:var(--line);color:var(--muted)}
.demo-tag{font-size:10.5px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:4px;opacity:.8}
.applicants{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.applicant{display:flex;align-items:center;gap:8px;font-size:14px}
.applicant .avatar{width:28px;height:28px;font-size:12px}
.applicant .nm{flex:1;min-width:0}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:4.6em 1fr auto;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:baseline;font-size:14px}
.timeline time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.timeline .plus{color:var(--sun);font-weight:700;font-variant-numeric:tabular-nums}
.timeline .minus{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

/* exchange */
.goods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.good{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.good .pic{aspect-ratio:4/3;display:grid;place-items:center;background:var(--bamboo-soft);color:var(--bamboo)}
.good .inf{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.good b{font-size:14.5px;line-height:1.4}
.good small{font-size:11.5px;color:var(--muted)}
.good .btn{margin-top:auto}

/* done screen */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:28px}
.done .badge{width:88px;height:88px;border-radius:50%;background:var(--bamboo-soft);color:var(--bamboo);display:grid;place-items:center}
.done h2{font-size:22px}
.done p{margin:0;color:var(--muted);max-width:30em}
.done .btns{display:grid;gap:10px;width:100%;margin-top:10px}

/* sheet & toast */
.scrim{position:absolute;inset:0;background:rgba(10,20,12,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.sheet h2{font-size:19px}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.sum{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:500;font-size:14px;box-shadow:var(--shadow);transition:opacity .25s,transform .25s}
.toast.hide{opacity:0;transform:translateY(8px);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view" aria-live="polite"></main>
  <div id="action" hidden></div>
  <nav class="tabnav" id="tabnav" aria-label="メインメニュー"></nav>
  <div id="sheet"></div>
  <div class="toast hide" id="toast" role="status"></div>
</div>

<script>
/* ---------- データ（サンプル） ---------- */
const TODAY = '2026-09-30';
const KM_PER_UNIT = 0.03;           // 地図1単位 = 30m（デモ用の縮尺）
const ME = { x: 205, y: 135 };      // 現在地（デモ用の仮の位置）
const TSUBO_TAN = 991.7;            // 1反 ≒ 991.7㎡

const TASKS = {
  '伐採': { desc: '竹をのこぎりで切り倒す' },
  '整備': { desc: '枝払い・下草刈り・通り道づくり' },
  '運搬': { desc: '切った竹を運び出して積み込む' },
};

let seq = 100;
const state = {
  screen: 'home', params: {}, stack: [],
  filter: new Set(), sort: 'near', selected: null,
  myTab: 'applied', sheet: null, regPhoto: null, regPin: { x: 150, y: 130 },
  points: 350,

/* 竹林のイラスト写真（シードで少しずつ違う絵にする） */
function photo(seed) {
  let s = seed * 9301 + 49297;
  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const sky = ['#cfe6c0', '#d9ecc6', '#c6e2c9', '#e1eec2'][seed % 4];
  let stalks = '';
  for (let i = 0; i < 11; i++) {
    const x = 6 + i * 14.5 + r() * 8, w = 3 + r() * 3.5, shade = ['#5e9a3f', '#4d8a37', '#6fae47', '#3f7a31'][Math.floor(r() * 4)];
    stalks += `<rect x="${x.toFixed(1)}" y="-2" width="${w.toFixed(1)}" height="104" fill="${shade}"/>`;
    for (let y = 12 + r() * 14; y < 100; y += 22 + r() * 6) stalks += `<rect x="${(x - .6).toFixed(1)}" y="${y.toFixed(1)}" width="${(w + 1.2).toFixed(1)}" height="1.6" fill="#2f5e25" opacity=".7"/>`;
  }
  let leaves = '';
  for (let i = 0; i < 26; i++) {
    const x = r() * 160, y = r() * 45, a = -40 + r() * 80;
    leaves += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="9" ry="2.4" fill="${r() > .5 ? '#7cb84e' : '#98c95c'}" transform="rotate(${a.toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;
  }
  return `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="100" fill="${sky}"/><rect y="82" width="160" height="18" fill="#a9c77d"/>${stalks}${leaves}</svg>`;
}
const groveImg = g => g.photo ? `<img src="${g.photo}" alt="">` : photo(g.seed);

/* ---------- 画面遷移 ---------- */
function go(screen, params = {}) {
  state.stack.push({ screen: state.screen, params: state.params });
  state.screen = screen; state.params = params; state.sheet = null;
  render(true);
}
function tab(screen) { state.stack = []; state.screen = screen; state.params = {}; state.sheet = null; render(true); }
function back() {
  const p = state.stack.pop();
  if (p) { state.screen = p.screen; state.params = p.params; } else state.screen = 'home';
  state.sheet = null; render(true);
}

      <div class="point-card">

      <div class="stats">

        <div class="stat"><b>${state.applications.filter(a => a.status !== 'done').length}</b><span>応募中・予定</span></div>
        <div class="stat"><b>${mine.length}</b><span>登録した竹林</span></div>
      </div>
      <div class="seg" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${state.myTab === k}" data-act="mytab" data-t="${k}">${l}</button>`).join('')}</div>

        <div class="inf"><b>${g.name}</b><small>${g.from}</small><span class="pts"><big>${num(g.pt)}</big> pt</span>

const ACTIONS = {
  detail() {
    const g = grove(state.params.id);
    if (g.mine) return `<button class="btn ghost" data-act="tab" data-to="mypage" data-mytab="groves">あなたが登録した竹林です（応募者を見る）</button>`;

    if (isFull(g)) return `<button class="btn" disabled>定員に達しました</button>`;
    return `<button class="btn" data-act="apply" data-id="${g.id}">この作業に応募する</button>`;
  },
  register() { return `<button class="btn" type="submit" form="regForm">この内容で竹林を登録する</button>`; },
};

/* ---------- シート（確認画面） ---------- */
function renderSheet() {
  const el = $('#sheet'), sh = state.sheet;
  if (!sh) { el.innerHTML = ''; return; }
  if (sh.type === 'apply') {
    const g = grove(sh.id);
    el.innerHTML = `<div class="scrim" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" data-stop>
      <span class="grab"></span><h2 id="sh-t">この作業に応募しますか？</h2>
      <div class="sum"><b>${esc(g.name)}</b><div>${fmtDate(g.date, g.time)}（約${g.hours}時間）</div><div>${g.tasks.join('・')}</div><div>もらえるポイント：<b class="pts">${g.pt}pt</b></div></div>
      <div class="field"><label for="ap-msg">所有者へのメッセージ（任意）</label><textarea id="ap-msg" placeholder="例：高専の友達と2人で参加したいです。のこぎりは持っていきます。"></textarea></div>
      <div class="row"><button class="btn ghost" data-act="closesheet">やめる</button><button class="btn" data-act="confirmapply" data-id="${g.id}">応募する</button></div>
    </div></div>`;
  } else if (sh.type === 'exch') {
    const it = GOODS.find(x => x.id === sh.id);
    el.innerHTML = `<div class="scrim" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" data-stop>
      <span class="grab"></span><h2 id="sh-t">「${it.name}」と交換しますか？</h2>
      <div class="sum"><div>使うポイント：<b class="pts">${num(it.pt)}pt</b></div><div>交換後の残り：${num(state.points - it.pt)}pt</div><div class="hint">受け取りは地域の交流センターを想定しています（デモ）</div></div>
      <div class="row"><button class="btn ghost" data-act="closesheet">やめる</button><button class="btn sun" data-act="confirmexch" data-id="${it.id}">交換する</button></div>
    </div></div>`;
  }
  setTimeout(() => el.querySelector('.sheet .btn:last-child')?.focus(), 30);
}

/* ---------- 登録フォーム ---------- */
function bindRegister() {
  const map = $('#pickMap');
  map.addEventListener('click', e => {
    const r = map.getBoundingClientRect();
    state.regPin = { x: (e.clientX - r.left) / r.width * 360, y: (e.clientY - r.top) / r.height * 250 };
    $('#pickPin').setAttribute('style', pct(state.regPin.x, state.regPin.y));
  });
  $('#r-photo').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      state.regPhoto = rd.result;
      const drop = $('#photoDrop'); drop.querySelector('span')?.remove(); drop.querySelector('img')?.remove();
      drop.insertAdjacentHTML('beforeend', `<img src="${state.regPhoto}" alt="選んだ写真">`);
    };
    rd.readAsDataURL(f);
  });
  $('#regForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const tasks = fd.getAll('tasks');
    const name = fd.get('name').trim(), date = fd.get('date');
    const errs = [];
    if (!name) errs.push('竹林の名前を入力してください。');
    if (!tasks.length) errs.push('必要な作業を1つ以上えらんでください。');
    if (!date) errs.push('希望日をえらんでください。');
    const err = $('#regErr');
    if (errs.length) { err.innerHTML = errs.join('<br>'); err.hidden = false; err.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    let size = Number(fd.get('size')) || 500;
    if (fd.get('unit') === 'tan') size = Math.round(size * TSUBO_TAN);
    const g = {
      id: ++seq, name, addr: fd.get('addr').trim() || '場所は地図で指定', x: state.regPin.x, y: state.regPin.y, size, tasks,
      people: Math.max(1, Number(fd.get('people')) || 1), joined: 0, date, time: fd.get('time') || '09:00', hours: Number(fd.get('hours')),
      pt: Number(fd.get('pt')), gift: fd.get('gift').trim(), owner: 'あなた', mine: true, seed: seq, photo: state.regPhoto,
      note: fd.get('note').trim(), applicants: [],
    };
    state.groves.push(g);
    state.history.unshift({ date: TODAY, text: `「${name}」を登録`, pt: 0 });
    state.regPhoto = null; state.regPin = { x: 150, y: 130 };
    state.stack = []; state.screen = 'registered'; state.params = { id: g.id }; render(true);
  });
}
function fillDemo() {
  const set = (id, v) => { $(id).value = v; };
  set('#r-name', '見能林町・田んぼ横の竹林'); set('#r-addr', '阿南市見能林町（サンプル）');
  set('#r-size', '1.5'); set('#r-unit', 'tan'); set('#r-date', '2026-10-26'); set('#r-time', '09:00');
  set('#r-hours', '3'); set('#r-people', '4'); set('#r-pt', '300'); set('#r-gift', '切った竹は持ち帰りOK・竹炭づくりに使えます');
  set('#r-note', '竹が田んぼの日当たりをさえぎっています。田んぼ側の竹を中心に切ってほしいです。');
  document.querySelectorAll('#regForm input[name=tasks]').forEach(c => c.checked = c.value !== '整備');
  state.regPin = { x: 258, y: 146 }; $('#pickPin').setAttribute('style', pct(258, 146));
  $('#regErr').hidden = true;
  toast('サンプルを入力しました。写真は自由に選べます。');
}

/* ---------- 操作 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.dataset.act === 'closesheet' && e.target.closest('[data-stop]') && t.classList.contains('scrim')) return;
  const id = Number(t.dataset.id);
  switch (t.dataset.act) {
    case 'back': back(); break;
    case 'tab': if (t.dataset.mytab) state.myTab = t.dataset.mytab; tab(t.dataset.to); break;
    case 'go': go(t.dataset.to); break;
    case 'detail': go('detail', { id }); break;
    case 'pin':
      state.selected = id; render(false);
      document.getElementById('card-' + id)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      break;
    case 'filter': {
      const k = t.dataset.t;
      if (!k) state.filter.clear(); else state.filter.has(k) ? state.filter.delete(k) : state.filter.add(k);
      render(false); break;
    }
    case 'apply': state.sheet = { type: 'apply', id }; renderSheet(); break;
    case 'closesheet': state.sheet = null; renderSheet(); break;
    case 'confirmapply': {
      const g = grove(id);
      state.applications.unshift({ id: ++seq, groveId: id, status: 'pending', msg: $('#ap-msg')?.value || '' });
      g.joined++;
      state.history.unshift({ date: TODAY, text: `「${g.name}」に応募`, pt: 0 });
      state.stack = [{ screen: 'search', params: {} }]; state.screen = 'applied'; state.params = { id }; state.sheet = null; render(true);
      break;
    }
    case 'approveme': {
      const a = state.applications.find(x => x.id === id); a.status = 'approved';
      toast(`${grove(a.groveId).owner}が応募を承認しました。参加確定です！`); render(false); break;
    }
    case 'complete': {
      const a = state.applications.find(x => x.id === id), g = grove(a.groveId);
      a.status = 'done'; state.points += g.pt;
      state.history.unshift({ date: g.date, text: `「${g.name}」で${g.tasks.join('・')}に参加`, pt: g.pt });
      toast(`おつかれさまでした！ ${g.pt}pt を獲得しました`); render(false); break;
    }
    case 'approveapp': {
      const g = grove(id); g.applicants[Number(t.dataset.i)].ok = true;
      toast('応募者を承認しました。参加確定の連絡が届きます（デモ）'); render(false); break;
    }
    case 'mytab': state.myTab = t.dataset.t; render(false); break;
    case 'exch': state.sheet = { type: 'exch', id: t.dataset.id }; renderSheet(); break;
    case 'confirmexch': {
      const it = GOODS.find(x => x.id === t.dataset.id);
      state.points -= it.pt; state.history.unshift({ date: TODAY, text: `${it.name}と交換`, pt: -it.pt });
      state.sheet = null; render(false); toast(`「${it.name}」との交換を受け付けました（デモ）`); break;
    }
    case 'step': { const inp = $('#r-people'); inp.value = Math.min(30, Math.max(1, (Number(inp.value) || 1) + Number(t.dataset.d))); break; }
    case 'filldemo': fillDemo(); break;
    case 'showmine': state.selected = id; state.filter.clear(); state.sort = 'near'; tab('search');
      setTimeout(() => document.getElementById('card-' + id)?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 50); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sort') { state.sort = e.target.value; render(false); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) { state.sheet = null; renderSheet(); } });

render(true);
</script>
